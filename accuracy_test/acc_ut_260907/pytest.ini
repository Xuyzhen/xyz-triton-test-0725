[pytest]
addopts = -ra --strict-markers
testpaths =
    gpu
    npu
markers =
    gpu: runs on the CUDA side (acc_ut_260907)
    npu: runs on the Ascend NPU side (acc_ut_260907)
    npu_upstream_reuse: NPU side executes the upstream vLLM kernel unmodified
    npu_ascend_adapted: NPU side executes an ascend-adapted kernel variant
    npu_upstream_unwired: upstream vLLM kernel not wired into the NPU production path
    accuracy_l0: bitwise comparison (non-compute / copy-only kernels)
    accuracy_l1: tolerance-based comparison against the CPU reference
    accuracy_l2: statistical comparison (probabilities, sampling)
    deterministic: fixed seeds, fully reproducible inputs
    stochastic: statistically validated sampling kernel
    requires_vllm_main: requires a vllm main-compatible checkout
