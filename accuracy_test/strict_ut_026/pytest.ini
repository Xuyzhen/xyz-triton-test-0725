[pytest]
addopts = -ra --strict-markers
testpaths = gpu npu
markers =
    gpu: runs the original vLLM kernel on CUDA
    npu: runs a kernel on Ascend NPU
    npu_ascend_adapted: runs the vLLM-Ascend implementation used in production
    npu_upstream_reuse: runs an upstream vLLM kernel reused on NPU
    npu_upstream_unwired: runs an upstream kernel not yet wired into the Ascend wrapper
    accuracy_l0: Ascend accuracy standard L0
    accuracy_l1: Ascend accuracy standard L1
    accuracy_l2: Ascend accuracy standard L2
    deterministic: repeated executions must be identical
    stochastic: validates a sampling distribution
    requires_vllm_main: requires a vLLM main-only symbol
